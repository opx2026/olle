<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-koodi generaator – Saaremaa Gümnaasium</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #06b6d4;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --gradient: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3), transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15), transparent 50%),
                        var(--bg-dark);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        .back-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(30, 41, 59, 0.8);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(100, 116, 139, 0.2);
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            color: var(--primary-color);
            transform: translateX(-3px);
            background: rgba(30, 41, 59, 0.95);
        }

        .header {
            margin-bottom: 3rem;
        }

        .qr-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 10px 20px rgba(99, 102, 241, 0.3));
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .generator-form {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid rgba(100, 116, 139, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            text-align: left;
        }

        input[type="text"], select {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid rgba(100, 116, 139, 0.2);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        input[type="file"] {
            padding: 0.75rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            accent-color: var(--primary-color);
        }

        .checkbox-group label {
            margin: 0;
            color: var(--text-secondary);
        }

        .logo-upload {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .logo-upload.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.5rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        .generate-btn {
            font-size: 1.1rem;
            padding: 1.2rem 2.5rem;
        }

        #qr-result {
            margin-top: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        #qr-result.show {
            opacity: 1;
            transform: translateY(0);
        }

        #qr-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 1.5rem;
        }

        #qr-canvas {
            border-radius: 8px;
        }

        #action-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .success-message, .error-message {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .success-message {
            background: var(--success-color);
            color: white;
        }

        .error-message {
            background: var(--warning-color);
            color: white;
        }

        .success-message.show, .error-message.show {
            transform: translateX(0);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .generator-form {
                padding: 1.5rem;
            }

            .back-link {
                top: 1rem;
                left: 1rem;
            }

            #action-buttons {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 100%;
                max-width: 200px;
            }

            .success-message, .error-message {
                top: 1rem;
                right: 1rem;
                left: 1rem;
                text-align: center;
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }

        .fade-in:nth-child(1) { animation-delay: 0.1s; }
        .fade-in:nth-child(2) { animation-delay: 0.2s; }
        .fade-in:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <div class="sg-pais"><span class="sg-logo" role="img" aria-label="Saaremaa Gümnaasium"></span></div>
    
    <div class="container">
        <div class="header fade-in">
            <div class="qr-icon">📱</div>
            <h1>QR-koodi generaator</h1>
            <p class="description">Loo QR-koode mis iganes sisuga - URL-id, tekst, kontaktandmed ja palju muud</p>
        </div>

        <div class="generator-form fade-in">
            <div class="input-group">
                <label for="url-input">Sisesta sisu (URL, tekst, jne.)</label>
                <input type="text" id="url-input" placeholder="https://example.com või mis iganes sisu">
            </div>

            <div class="input-group">
                <label for="logo-option">Logo valik</label>
                <select id="logo-option" onchange="handleLogoChange()">
                    <option value="saaremaa">Saaremaa Gümnaasiumi logo</option>
                    <option value="none">Ilma logota</option>
                    <option value="custom">Vali ise logo</option>
                </select>
            </div>

            <div class="logo-upload" id="logo-upload">
                <div class="input-group">
                    <label for="logo-input">Vali oma logo (JPG, PNG, SVG)</label>
                    <input type="file" id="logo-input" accept=".jpg,.jpeg,.png,.svg">
                </div>
            </div>

            <button class="generate-btn" onclick="generateQRCode()">🔄 Genereeri QR-kood</button>
        </div>

        <div id="qr-result" class="fade-in">
            <div id="qr-container">
                <canvas id="qr-canvas"></canvas>
            </div>
            <div id="action-buttons">
                <button onclick="copyQRCode()">📋 Kopeeri</button>
                <button onclick="saveQRCode()">💾 Salvesta</button>
                <button onclick="clearResult()">🗑️ Kustuta</button>
            </div>
        </div>
    </div>

    <script>
        function handleLogoChange() {
            const logoOption = document.getElementById('logo-option').value;
            const logoUpload = document.getElementById('logo-upload');
            
            if (logoOption === 'custom') {
                logoUpload.classList.add('show');
            } else {
                logoUpload.classList.remove('show');
                document.getElementById('logo-input').value = '';
            }
        }

        function generateQRCode() {
            const url = document.getElementById('url-input').value;
            const canvas = document.getElementById('qr-canvas');
            const resultDiv = document.getElementById('qr-result');
            const logoOption = document.getElementById('logo-option').value;
            const logoInput = document.getElementById('logo-input');

            if (!url.trim()) {
                showMessage('Palun sisesta sisu QR-koodi jaoks!', 'error');
                return;
            }

            // Genereeri QR-kood
            QRCode.toCanvas(canvas, url, { 
                width: 300, 
                margin: 2,
                color: {
                    dark: '#0f172a',
                    light: '#ffffff'
                }
            }, function (error) {
                if (error) {
                    console.error(error);
                    showMessage('QR-koodi genereerimine ebaõnnestus.', 'error');
                } else {
                    if (logoOption === 'saaremaa') {
                        addLogoToQRCode(canvas, SG_LOGO, () => {
                            showResult();
                            showMessage('QR-kood Saaremaa Gümnaasiumi logoga valmis!', 'success');
                        });
                    } else if (logoOption === 'custom' && logoInput.files[0]) {
                        addLogoFromFile(canvas, logoInput.files[0], () => {
                            showResult();
                            showMessage('QR-kood sinu logoga valmis!', 'success');
                        });
                    } else {
                        showResult();
                        showMessage('QR-kood valmis!', 'success');
                    }
                }
            });
        }

        function addLogoToQRCode(canvas, logoSrc, callback) {
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                const logoSize = canvas.width * 0.15;
                const x = (canvas.width - logoSize) / 2;
                const y = (canvas.height - logoSize) / 2;
                
                // Lisa valge taust logo alla
                ctx.fillStyle = 'white';
                ctx.fillRect(x - 5, y - 5, logoSize + 10, logoSize + 10);
                
                // Lisa logo
                ctx.drawImage(img, x, y, logoSize, logoSize);
                
                if (callback) callback();
            };
            img.onerror = function() {
                showMessage('Saaremaa Gümnaasiumi logo ei leitud! Logo on lehe sisse ehitatud, proovi leht uuesti laadida.', 'error');
                // Jätka ilma logota
                showResult();
            };
            img.src = logoSrc;
        }

        function addLogoFromFile(canvas, logoFile, callback) {
            const ctx = canvas.getContext('2d');
            const img = new Image();
            const reader = new FileReader();

            reader.onload = function(e) {
                img.onload = function() {
                    const logoSize = canvas.width * 0.15;
                    const x = (canvas.width - logoSize) / 2;
                    const y = (canvas.height - logoSize) / 2;
                    
                    // Lisa valge taust logo alla
                    ctx.fillStyle = 'white';
                    ctx.fillRect(x - 5, y - 5, logoSize + 10, logoSize + 10);
                    
                    // Lisa logo
                    ctx.drawImage(img, x, y, logoSize, logoSize);
                    
                    if (callback) callback();
                };
                img.src = e.target.result;
            };

            reader.onerror = function() {
                showMessage('Logo laadimine ebaõnnestus! Proovi teist faili.', 'error');
            };

            reader.readAsDataURL(logoFile);
        }

        function showResult() {
            const resultDiv = document.getElementById('qr-result');
            resultDiv.classList.add('show');
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function clearResult() {
            const resultDiv = document.getElementById('qr-result');
            resultDiv.classList.remove('show');
            document.getElementById('url-input').value = '';
            document.getElementById('logo-option').value = 'saaremaa';
            document.getElementById('logo-input').value = '';
            handleLogoChange();
        }

        function saveQRCode() {
            const canvas = document.getElementById('qr-canvas');
            const link = document.createElement('a');
            const timestamp = new Date().toISOString().slice(0, 10);
            link.download = `qr-kood-${timestamp}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showMessage('QR-kood salvestatud!', 'success');
        }

        async function copyQRCode() {
            const canvas = document.getElementById('qr-canvas');
            try {
                canvas.toBlob(async (blob) => {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    showMessage('QR-kood kopeeritud lõikelauale!', 'success');
                });
            } catch (error) {
                // Fallback - kopeeri URL
                try {
                    await navigator.clipboard.writeText(canvas.toDataURL());
                    showMessage('QR-kood kopeeritud (andmete URL-ina)!', 'success');
                } catch (fallbackError) {
                    showMessage('Kopeerimine ebaõnnestus. Kasuta salvestamise funktsiooni.', 'error');
                }
            }
        }

        function showMessage(text, type) {
            // Eemalda varasemad teated
            document.querySelectorAll('.success-message, .error-message').forEach(msg => msg.remove());

            const message = document.createElement('div');
            message.className = `${type}-message`;
            message.textContent = text;
            document.body.appendChild(message);

            // Näita teadet
            setTimeout(() => message.classList.add('show'), 100);

            // Peida teade 3 sekundi pärast
            setTimeout(() => {
                message.classList.remove('show');
                setTimeout(() => message.remove(), 300);
            }, 3000);
        }

        // Lisa klaviatuuri toetus
        document.getElementById('url-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateQRCode();
            }
        });

        // Laadimine
        document.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
<script>
(function () {   // menüü: puuteekraanil avab esimene puudutus loendi, teine viib avalehele
  var m = document.getElementById('menyy'); if (!m) return;
  var n = m.querySelector('.menyy-nupp');
  n.addEventListener('click', function (e) {
    if (window.matchMedia('(hover: none)').matches && !m.classList.contains('lahti')) { e.preventDefault(); m.classList.add('lahti'); }
  });
  document.addEventListener('click', function (e) { if (!m.contains(e.target)) m.classList.remove('lahti'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { m.classList.remove('lahti'); if (document.activeElement) document.activeElement.blur(); } });
})();
</script>

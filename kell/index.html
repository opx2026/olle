    padding: .7rem 1.15rem; border-radius: 999px;
    border: 2px solid currentColor; background: transparent;

    position: fixed; top: 14px; left: 14px; z-index: 2000;

  .menyy.voolus { position: relative; top: auto; left: auto; right: auto; }
  .menyy .menyy-nupp {
    display: inline-flex; align-items: center; gap: .55rem; padding: .68rem 1.05rem; border-radius: 999px;

    font: inherit; }
  .menyy .menyy-nupp::after { content: ""; width: .4em; height: .4em; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-.14em) rotate(45deg); opacity: .85; }

  var toon = document.createElement('canvas'), toonVarv = '';

<script>
(function () {   // menüü: puuteekraanil avab esimene puudutus loendi, teine viib avalehele
  var m = document.getElementById('menyy'); if (!m) return;
  var n = m.querySelector('.menyy-nupp');
  n.addEventListener('click', function (e) {
    if (window.matchMedia('(hover: none)').matches && !m.classList.contains('lahti')) { e.preventDefault(); m.classList.add('lahti'); }
  });
  document.addEventListener('click', function (e) { if (!m.contains(e.target)) m.classList.remove('lahti'); });

})();
